name: iOS Build

on:
  push:
    branches:
      - main
      - multiwiki-main
  pull_request:
    branches:
      - main
      - multiwiki-main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.5"
  IOS_VERSION: "26.5"

jobs:
  build:
    name: Build Wikipedia iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app"
          elif [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -switch /Applications/Xcode_26.app
          else
            sudo xcode-select -switch /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: Generate open source build configuration
        run: |
          bash scripts/setup_bundle_id ci
          test -f Configurations/OpenSourceDebug.xcconfig

      - name: Show available schemes and destinations
        run: |
          xcodebuild -list -project Wikipedia.xcodeproj
          xcodebuild -showdestinations -project Wikipedia.xcodeproj -scheme Wikipedia || true

      - name: Build app for iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project Wikipedia.xcodeproj \
            -scheme Wikipedia \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -e
          app_path=$(find Build/Build/Products/Debug-iphoneos -maxdepth 2 -name '*.app' -type d | head -n 1)
          if [ -z "$app_path" ]; then
            echo 'No .app bundle found in Debug-iphoneos build products.'
            find Build/Build/Products -maxdepth 4 -type d || true
            exit 1
          fi
          rm -rf artifacts Payload
          mkdir -p artifacts Payload
          cp -R "$app_path" Payload/
          /usr/bin/zip -qry artifacts/Wikipedia-unsigned.ipa Payload
          ls -lh artifacts
          file artifacts/Wikipedia-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wikipedia-unsigned-ipa
          path: artifacts/Wikipedia-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publish direct IPA release asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ipa-${{ github.run_number }}
        run: |
          set -e
          gh release create "$TAG_NAME" artifacts/Wikipedia-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Unsigned IPA $TAG_NAME" \
            --notes "Unsigned IPA built from $GITHUB_SHA. Download the .ipa asset directly from this release."

      - name: Print build errors
        if: failure()
        run: |
          echo '---- xcodebuild errors ----'
          grep -n -i -E '(^|[^A-Za-z])(error:|fatal error:|Command .* failed|BUILD FAILED|No .app bundle found)' xcodebuild.log | tail -80 || true
